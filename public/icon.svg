<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </radialGradient>

    <!-- Playzy Primary Futuristic Emerald/Cyan Gradient -->
    <linearGradient id="prismGradient1" x1="120" y1="110" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#00C9A7"/>
      <stop offset="70%" stop-color="#00A9C0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Secondary Accent Gradient for Facets -->
    <linearGradient id="prismFacet" x1="160" y1="130" x2="350" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00C9A7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#29CC5F"/>
    </linearGradient>

    <!-- Glow Filter for Ambient Bloom -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Star Glow -->
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#00C9A7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container with Card Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" filter="url(#cardShadow)"/>
  
  <!-- Outer Subtle Ambient Neon Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#prismGradient1)" stroke-width="4" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="460" height="460" rx="110" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.1"/>

  <!-- Ambient Internal Light Cone -->
  <circle cx="256" cy="256" r="140" fill="#00C9A7" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Dynamic Playzy Glyph: Dimensional Modern Play Prism + Neural Spark -->
  <g filter="url(#neonGlow)">
    <!-- Main Left-To-Right Play Prism (Upper Facet) -->
    <path d="M168 136C168 122.193 182.932 113.572 194.89 120.478L376.89 225.478C388.948 232.434 388.948 249.566 376.89 256.522L260 324L168 250V136Z"
          fill="url(#prismGradient1)"/>

    <!-- Bottom Dimensional Facet (Reflective Depth) -->
    <path d="M168 250L260 324L194.89 361.522C182.932 368.428 168 359.807 168 346V250Z"
          fill="url(#prismFacet)"/>

    <!-- Center Geometric Fracture Line / Neural Conduit -->
    <path d="M168 250L260 324L376.89 256.522" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>

    <!-- Soundwave & Neural Energy Ring Curves -->
    <path d="M400 190C418 210 428 234 428 256C428 278 418 302 400 322"
          stroke="url(#prismGradient1)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M436 160C462 188 476 221 476 256C476 291 462 324 436 352"
          stroke="url(#prismGradient1)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.45"/>

    <!-- Four-Point AI Sparkle Star Emitted from Center -->
    <g transform="translate(260, 240)">
      <path d="M0 -34C1.5 -12 12 -1.5 34 0C12 1.5 1.5 12 0 34C-1.5 12 -12 1.5 -34 0C-12 -1.5 -1.5 -12 0 -34Z"
            fill="url(#sparkGradient)"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
